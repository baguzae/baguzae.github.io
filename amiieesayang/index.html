<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You ♡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd3e0'/%3E%3Cpath d='M32 50C10 35 14 16 26 16c4 0 6 3 6 5 0-2 2-5 6-5 12 0 16 19-6 34z' fill='%23e8728f'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--pink:#f7b6cb;--rose:#e8728f;--blush:#ffe3ec;--cream:#fff6ee;--lav:#d9ccf5;--gold:#c9a36b;--ink:#5b3a46;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',-apple-system,'SF Pro Display',system-ui,sans-serif;--hand:'Caveat','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--blush);color:var(--ink);font-family:var(--sans)}
body{background:linear-gradient(160deg,#ffe3ec,#fbd0e0 45%,#e4d6fa)}
#tone{position:fixed;inset:0;z-index:0;pointer-events:none}#tone i{position:absolute;inset:0;opacity:0;transition:opacity 1.6s;will-change:opacity}
#tone i:nth-child(1){background:linear-gradient(160deg,#e9dcfb,#f9cfe0 60%,#ffe3ec)}#tone i:nth-child(2){background:linear-gradient(200deg,#ffe8dc,#fbc6d6 55%,#e8d6fa)}
#tone i:nth-child(3){background:linear-gradient(140deg,#fbc0d3,#f6a9c4 50%,#e0cdf6)}#tone i:nth-child(4){background:linear-gradient(180deg,#ffd6e4,#f7b6cb 55%,#fff0f4)}
#tone b{position:absolute;top:-25vmax;left:-25vmax;width:75vmax;height:75vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 65%);will-change:transform;animation:drift 20s ease-in-out infinite alternate}
#tone b.b2{top:auto;left:auto;bottom:-30vmax;right:-25vmax;background:radial-gradient(circle,rgba(217,204,245,.8),transparent 65%);animation-duration:26s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(35vw,25vh) scale(1.25)}}
body.s1 #tone i:nth-child(1),body.s2 #tone i:nth-child(2),body.s3 #tone i:nth-child(3),body.s4 #tone i:nth-child(4){opacity:1}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;opacity:0;visibility:hidden;transform:scale(1.03);will-change:opacity,transform;transition:opacity .9s,transform 1.1s cubic-bezier(.2,.8,.2,1),visibility 0s .9s}
.screen.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.screen.out{transform:scale(.94)}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.1}
h1{font-size:clamp(40px,11vw,76px)}h2{font-size:clamp(28px,7vw,48px)}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(20px,5vw,28px);opacity:.85;min-height:1.4em}
.glass{background:rgba(255,255,255,.28);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:.5px solid rgba(255,255,255,.6);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(255,255,255,.5),inset 0 0 26px rgba(255,255,255,.28),0 14px 40px rgba(200,80,120,.22);border-radius:30px}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.55),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.3))}
.btn{font:500 16px var(--sans);color:var(--ink);padding:16px 30px;border-radius:999px;border:.5px solid rgba(255,255,255,.7);cursor:pointer;position:relative;overflow:hidden;background:rgba(255,255,255,.3);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(255,255,255,.5),inset 0 0 18px rgba(255,255,255,.3),0 8px 24px rgba(200,80,120,.25);transition:transform .35s cubic-bezier(.3,1.7,.5,1),box-shadow .3s}
.btn::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}.btn:hover::after{transform:translateX(120%)}
.btn:hover{box-shadow:0 10px 36px rgba(232,114,143,.5),inset 0 1px 0 #fff}
.btn:active{transform:scale(.94)}
.btn.yes{font-size:18px;font-weight:600;padding:18px 34px;color:#fff;background:linear-gradient(135deg,#f58aa8,#e8728f);animation:glow 2.4s ease-in-out infinite}
.btn.no{font-size:14px;padding:12px 22px;opacity:.85}
@keyframes glow{50%{transform:scale(1.04)}}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.hide{opacity:0;pointer-events:none}.fade{transition:opacity .8s}
.dots{display:flex;gap:8px}.dots i{width:7px;height:7px;border-radius:9px;background:rgba(91,58,70,.25);transition:.5s}.dots i.a{width:24px;background:var(--rose)}
/* loader */
#load{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(160deg,#ffe3ec,#e4d6fa);transition:opacity .9s;font-family:var(--serif);font-size:28px}
#load b{display:block;font-size:54px;color:var(--rose);animation:beat 1.1s infinite}
@keyframes beat{40%{transform:scale(1.25)}}
/* dynamic island */
#isl{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(.6);z-index:30;width:132px;height:38px;border-radius:22px;background:#09080b;color:#fff;overflow:hidden;opacity:0;pointer-events:none;box-shadow:0 10px 34px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.2);transition:width .7s cubic-bezier(.2,1.25,.3,1),height .7s cubic-bezier(.2,1.25,.3,1),border-radius .7s,opacity .6s,transform .7s cubic-bezier(.2,1.25,.3,1)}
#isl.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#isl.x{width:min(92vw,360px);height:184px;border-radius:36px}
#isl .hd{display:flex;align-items:center;gap:12px;padding:6px 12px;height:38px;cursor:pointer;transition:height .7s cubic-bezier(.2,1.25,.3,1),padding .7s}
#isl.x .hd{height:76px;padding:16px 18px 0}
.art{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,#f7b6cb,#d9ccf5) center/cover;display:grid;place-items:center;font-size:12px;color:#fff;transition:.7s cubic-bezier(.2,1.25,.3,1);box-shadow:0 0 14px rgba(255,143,177,.5)}
#isl.x .art{width:54px;height:54px;border-radius:13px;font-size:22px}
.tx{min-width:0;flex:1;text-align:left;font-size:12px;line-height:1.35;opacity:0;transition:opacity .3s}#isl.x .tx{opacity:1;transition-delay:.3s}
.tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx span{opacity:.6}
.vz{display:flex;gap:2px;align-items:flex-end;height:16px}.vz i{width:3px;height:4px;border-radius:2px;background:#ff8fb1;animation:vz .9s ease-in-out infinite alternate;animation-play-state:paused}
#isl.play .vz i{animation-play-state:running}.vz i:nth-child(2){animation-delay:.2s}.vz i:nth-child(3){animation-delay:.45s}.vz i:nth-child(4){animation-delay:.1s}
@keyframes vz{to{height:16px}}
.more{padding:8px 20px 0;opacity:0;pointer-events:none;transition:opacity .3s}#isl.x .more{opacity:1;pointer-events:auto;transition-delay:.35s}
#isl input[type=range]{width:100%;accent-color:#ff8fb1;height:4px}
.tm{display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:2px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.ctl input{width:64px!important}
.ctl button{background:none;border:0;color:#fff;font:600 14px var(--sans);width:44px;height:44px;border-radius:50%;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.ctl button:active{transform:scale(.85)}.ctl .pl{background:#fff;color:#000;font-size:15px}
/* bouquet */
#bq{position:relative;width:min(76vw,320px,calc((100dvh - 270px)/1.29));aspect-ratio:340/440}
#bq>*{position:absolute;inset:0}#bq svg{width:100%;height:100%;display:block;overflow:visible}
#bq .bk,#bq .fr{opacity:0;transform:translateY(40px)}
#bq.go .bk,#bq.go .fr{opacity:1;transform:none;transition:opacity .9s,transform 1.1s cubic-bezier(.2,1.1,.3,1)}
.bf{position:absolute;width:29%;margin:-18.1% 0 0 -14.5%;transform:scale(0);opacity:0}
.go .bf{animation:bloom 1.1s var(--d) cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(var(--r));opacity:1}}
.fh{position:relative;aspect-ratio:4/5;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 20px rgba(190,70,110,.35);background:linear-gradient(135deg,#ffd3e0,#d9ccf5);display:grid;place-items:center;color:#fff;font-size:22px;transform-origin:50% 120%;animation:sway 3.4s ease-in-out var(--sd) infinite alternate}
.fh img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.pt{position:absolute;inset:-26%;opacity:0;transform:scale(.2) rotate(-90deg)}
.go .pt{animation:petal 1.1s var(--d) cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes petal{to{opacity:1;transform:none}}
/* story */
#story .sub{font-size:clamp(26px,7vw,40px);font-style:normal;max-width:560px;line-height:1.3;min-height:5em;display:flex;align-items:center;justify-content:center}
.w{display:inline-block;white-space:nowrap}.ch{display:inline-block;opacity:0;transform:translateY(.55em) scale(.92);animation:chIn .8s cubic-bezier(.2,.9,.2,1) forwards}.ch.bl{filter:blur(8px)}@keyframes chIn{to{opacity:1;transform:none;filter:blur(0)}}
/* book */
#bookwrap{perspective:1600px;width:min(78vw,340px);aspect-ratio:3/4.1;position:relative}
#book{position:absolute;inset:0;perspective:1600px;transition:transform 1s cubic-bezier(.2,.8,.2,1);transform:rotateY(-8deg) rotateX(4deg)}
#book.open{transform:rotateY(0) rotateX(0)}
.pg{position:absolute;inset:0;transform-origin:left center;border-radius:6px 18px 18px 6px;background:linear-gradient(90deg,#f2e2d2 0,#fffaf3 8%,#fffaf3);box-shadow:0 10px 24px rgba(120,60,80,.28);will-change:transform;transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .4s;backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px 34px}
.pg.fl{transform:rotateY(-115deg);opacity:0;pointer-events:none;transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .4s .55s}
.pg .btn{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.8)}
.pg.cover{background:linear-gradient(135deg,#ffe0ea,#f9c4d6);border:2px solid var(--gold);outline:5px solid #fffaf3;outline-offset:-12px;gap:10px;box-shadow:0 22px 50px rgba(120,60,80,.4),inset 0 0 40px rgba(255,255,255,.5)}
.cover .emb{font-size:64px;color:#f6b7c8;text-shadow:0 -1px 0 #fff,0 2px 3px rgba(150,60,90,.45)}
.cover h2{font-size:30px;color:#8a3d57}.cover p{font-family:var(--serif);font-style:italic;color:#8a3d57}
.rib{position:absolute;right:26px;top:-4px;width:18px;height:90px;background:var(--rose);clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%)}
.pn{position:absolute;bottom:10px;font:12px var(--serif);opacity:.6}
.ph{position:relative;cursor:zoom-in;transition:transform .3s}.ph:hover{transform:scale(1.03) rotate(0)!important}
.ph .im{width:100%;aspect-ratio:4/5;border-radius:8px;background:linear-gradient(135deg,#ffd3e0,#e4d6fa);display:grid;place-items:center;color:#fff;font-size:34px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff6ee;display:block}
.cap{font-family:var(--hand);font-size:22px;line-height:1.15;margin-top:12px;color:#8a3d57}
.polaroid .ph{background:#fff;padding:10px 10px 4px;box-shadow:0 8px 22px rgba(0,0,0,.18);transform:rotate(-3deg);width:82%}
.tape .ph{width:78%;transform:rotate(2deg)}.tape .ph::before{content:"";position:absolute;top:-12px;left:50%;width:80px;height:24px;transform:translateX(-50%) rotate(-4deg);background:rgba(247,182,203,.75);z-index:2}
.flower .ph{width:78%;padding:8px;border-radius:50% 50% 16px 16px/30% 30% 16px 16px;background:linear-gradient(#ffe3ec,#fff)}.flower .im{border-radius:50% 50% 8px 8px/26% 26% 8px 8px}
.card .ph{width:80%;border-radius:22px;padding:8px;background:linear-gradient(135deg,#fff,#ffe3ec);box-shadow:0 10px 26px rgba(232,114,143,.3)}
.scrap .ph{width:76%;transform:rotate(-2deg);outline:6px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.dd{position:absolute;color:var(--rose);opacity:.55;pointer-events:none;font-size:22px}
/* letter */
#letterS{perspective:1100px}
#envglow{position:absolute;width:440px;height:440px;max-width:120vw;border-radius:50%;background:radial-gradient(circle,rgba(255,190,214,.95),transparent 65%);opacity:.45;animation:pulse 3s ease-in-out infinite;pointer-events:none;transition:opacity 1s}
#letterS.o #envglow{opacity:1}@keyframes pulse{50%{transform:scale(1.18)}}
#env{width:min(86vw,360px);height:230px;position:relative;cursor:pointer;animation:flt 4s ease-in-out infinite;transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .7s}
@keyframes flt{50%{transform:translateY(-10px) rotate(-1deg)}}
#env .back{position:absolute;inset:0;background:#f3e1cf;border-radius:10px;box-shadow:0 22px 44px rgba(120,60,80,.35)}
#env .flap{position:absolute;left:0;right:0;top:0;height:125px;background:linear-gradient(#f8ead9,#efd9c3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s cubic-bezier(.4,0,.2,1);z-index:3}
#env .front{position:absolute;inset:0;background:linear-gradient(135deg,#fbefe0,#f1dcc7);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2;display:grid;place-items:end center;padding-bottom:30px;font:italic 600 24px var(--serif)}
.seal{position:absolute;left:50%;top:100px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f59ab5,#d9527a);box-shadow:0 6px 14px rgba(150,40,80,.45),inset 0 -3px 6px rgba(120,20,60,.4);display:grid;place-items:center;color:#ffe3ec;font-size:24px;z-index:4;transition:transform .5s,opacity .5s}
#env.open .seal{transform:scale(1.6) rotate(25deg);opacity:0}
#env.open .flap{transform:rotateX(180deg);z-index:0}
#env.open{animation:none;transform:translateY(100px) scale(.85);opacity:0;pointer-events:none;transition:transform 1s 1.1s,opacity .7s 1.4s}
#paper{width:min(90vw,520px);max-height:74vh;overflow:auto;padding:30px 26px;text-align:left;font:500 clamp(17px,4.4vw,21px)/1.65 var(--serif);background:linear-gradient(#fffdf8,#fff4e8);border-radius:8px;box-shadow:0 20px 50px rgba(120,60,80,.3),0 0 60px rgba(255,190,214,.8);transform:translateY(160px) scale(.5);opacity:0;transition:transform 1.3s cubic-bezier(.2,1.1,.3,1),opacity .6s;white-space:pre-wrap;position:absolute;color:#4a2f3a}
#paper.on{transform:none;opacity:1}
/* proposal */
#prop{background:radial-gradient(circle at 50% 30%,rgba(255,200,215,.6),transparent 60%)}
#prop .rays{position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 30%,transparent 0 8%,rgba(255,255,255,.35) 10% 12%,transparent 14% 30%,rgba(255,255,255,.3) 32% 34%,transparent 36% 60%,rgba(255,255,255,.35) 62% 64%,transparent 66%);animation:spin 60s linear infinite;pointer-events:none}
.card2{position:relative;padding:34px 24px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:18px;align-items:center}
.portrait{width:120px;height:150px;border-radius:60px;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 30px rgba(232,114,143,.4);background:linear-gradient(135deg,#ffd3e0,#e4d6fa);display:grid;place-items:center;color:#fff;font-size:34px}
.portrait img{width:100%;height:100%;object-fit:cover}
.small{font-size:14px;line-height:1.6;opacity:.85;max-width:360px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:rgba(60,25,40,.8);backdrop-filter:blur(10px);display:none;place-items:center}
#lb.on{display:grid}#lb img{max-width:92vw;max-height:80vh;object-fit:contain;transition:transform .3s;cursor:zoom-in;border-radius:10px}#lb img.z{transform:scale(1.8);cursor:zoom-out}
#lb .row{position:absolute;bottom:max(20px,env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);z-index:70;padding:14px 22px;opacity:0;transition:.5s;pointer-events:none;font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%)}
.heart{position:fixed;z-index:40;pointer-events:none;color:var(--rose);animation:fly 1.8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),-80vh) scale(1.6);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}canvas#fx{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="fl" viewBox="0 0 40 40"><g fill="#f7b6cb"><circle cx="20" cy="8" r="7"/><circle cx="32" cy="17" r="7"/><circle cx="27" cy="31" r="7"/><circle cx="13" cy="31" r="7"/><circle cx="8" cy="17" r="7"/></g><circle cx="20" cy="20" r="5" fill="#f9d98c"/></symbol></svg>
<div id="tone"><i></i><i></i><i></i><i></i><b></b><b class="b2"></b></div>
<canvas id="fx"></canvas>
<div id="load"><div><b>♥</b>Menyiapkan sesuatu...</div></div>

<div id="isl" role="region" aria-label="Pemutar musik">
  <div class="hd" id="hd" role="button" tabindex="0" aria-label="Buka atau tutup pemutar"><div class="art" id="art">♥</div><div class="tx"><b id="song"></b><span id="artist"></span></div><div class="vz" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  <div class="more"><input id="seek" type="range" min="0" max="100" value="0" aria-label="Posisi lagu"><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctl"><input id="vol" type="range" min="0" max="1" step=".05" value=".6" aria-label="Volume"><button id="bk" aria-label="Mundur 10 detik">-10</button><button id="pp" class="pl" aria-label="Play atau pause">▶</button><button id="fw" aria-label="Maju 10 detik">+10</button><span style="width:64px"></span></div></div>
</div>

<section class="screen" id="intro">
  <h1 id="i1"></h1>
  <p class="sub" id="i2"></p>
  <button class="btn hide fade" id="openWorld">Open my little world ♡</button>
</section>

<section class="screen" id="story">
  <div class="sub" id="st"></div>
  <div class="dots" id="dots"></div>
  <button class="btn hide fade" id="cont">Continue</button>
</section>

<section class="screen" id="bookS">
  <div id="bookwrap"><div id="book"></div></div>
  <div class="row hide fade" id="bnav">
    <button class="btn" id="prev" aria-label="Halaman sebelumnya">‹</button>
    <button class="btn" id="next" aria-label="Halaman berikutnya">›</button>
  </div>
</section>

<section class="screen" id="letterS">
  <div id="envglow"></div>
  <div id="env" role="button" tabindex="0" aria-label="Buka amplop"><div class="back"></div><div class="seal">♥</div><div class="flap"></div><div class="front" id="envTo"></div></div>
  <div id="paper"></div>
  <button class="btn hide fade" id="toProp" style="position:absolute;bottom:max(24px,env(safe-area-inset-bottom))">Read my next question ♡</button>
</section>

<section class="screen" id="prop">
  <div class="rays"></div>
  <div class="card2 glass">
    <div class="portrait" id="pPortrait">♥</div>
    <h2>Would you make me the happiest person?</h2>
    <p class="sub" style="font-size:26px">Will you be my girlfriend? ♡</p>
    <p class="small" id="promise"></p>
    <div class="row"><button class="btn yes" id="yes">YES, I WANT TO ♡</button><button class="btn no" id="no">NO</button></div>
  </div>
</section>

<section class="screen" id="yesS">
  <div class="row" id="floatPh" style="gap:8px"></div>
  <h2 id="y1"></h2><p class="sub" id="y2"></p><h2 id="y3" style="font-size:clamp(26px,6vw,40px)"></h2><p class="sub" id="y4"></p>
  </section>

<section class="screen" id="bqS">
  <p class="sub" id="bqCap" style="font-size:clamp(26px,7vw,34px);color:var(--rose)"></p>
  <div id="bq">
    <div class="bk"><svg viewBox="0 0 340 440"><path d="M160 370L148 436M170 370L170 440M180 370L194 436M164 370L138 430M176 370L206 430" stroke="#6fae6a" stroke-width="6" stroke-linecap="round"/></svg></div>
    <div id="bflw"></div>
    <div class="fr"><svg viewBox="0 0 340 440"><defs><linearGradient id="wa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c6d4"/><stop offset="1" stop-color="#dca0b8"/></linearGradient><linearGradient id="wb" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe0e8"/><stop offset="1" stop-color="#e8b4c8"/></linearGradient></defs>
    <path d="M6 214L190 262L186 392L150 392Z" fill="url(#wa)"/><path d="M334 214L150 270L154 392L190 392Z" fill="url(#wb)" stroke="#fff" stroke-opacity=".5"/>
    <g fill="#f08fb0"><path d="M170 392C120 356 86 380 98 402C110 424 150 408 170 392Z"/><path d="M170 392C220 356 254 380 242 402C230 424 190 408 170 392Z"/><circle cx="170" cy="392" r="8"/></g><path d="M166 398C156 420 140 430 118 438M174 398C184 420 200 430 222 438" stroke="#f08fb0" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div>
  </div>
  <div class="row hide fade" id="yBtns"><button class="btn" id="replay">Replay our little story</button><button class="btn yes" id="save">Save this moment ♡</button></div>
</section>

<section class="screen" id="noS">
  <div style="font-size:64px;color:var(--rose);animation:beat 2s infinite">♥</div>
  <h2 id="n1"></h2><p class="sub" id="n2"></p><p class="sub" id="n3"></p>
  <button class="btn" id="back">Back to our little story</button>
</section>

<div id="lb"><img id="lbi" alt=""><div class="row"><button class="btn" id="lp" aria-label="Foto sebelumnya">‹</button><button class="btn" id="lc">Tutup</button><button class="btn" id="ln" aria-label="Foto berikutnya">›</button></div></div>
<div id="toast" class="glass"></div>

<script>
/* ============ CONFIG: edit semua konten di sini ============ */
const CONFIG = {
  herName: "Dia",            // nama cewek
  myName: "Aku",             // nama kamu
  createdAt: "23 November 2026",
  // MUSIK: taruh file di assets/music/bgz.mp3 (atau ubah path ini)
  music: { src: "assets/music/bgz.mp3", title: "Our Song", artist: "Untuk Kamu", chorusStart: 60, cover: "assets/images/photo1.webp" },
  // FOTO: taruh di assets/images/ lalu ubah src + caption
  photos: [
    { src: "assets/images/photo1.webp", caption: "Your smile is my favorite view." },
    { src: "assets/images/photo2.webp", caption: "I don't think you realize how beautiful you are." },
    { src: "assets/images/photo3.webp", caption: "Even the simplest moments become special when I see you." },
    { src: "assets/images/photo4.webp", caption: "Somehow, you make ordinary days feel extraordinary." },
    { src: "assets/images/photo5.webp", caption: "Here's a little reminder that you are appreciated, always." },
    { src: "assets/images/photo6.webp", caption: "Aku suka banget cara kamu ketawa." },
    { src: "assets/images/photo7.webp", caption: "Kamu bikin hal kecil jadi lucu." },
    { src: "assets/images/photo8.webp", caption: "Satu lagi alasan aku senyum hari ini." }
  ],
  intro: { line1: "Hi, pretty girl.", line2: "I made something special for you...", button: "Open my little world ♡" },
  story: [
    "Some people come into our lives...",
    "and somehow make everything feel a little more beautiful.",
    "Without even realizing it...",
    "you became one of my favorite reasons to smile.",
    "Now, I have something I want to tell you."
  ],
  bookTitle: "Little Things About You", bookSub: "A story I want you to read.",
  envelopeText: "To my favorite girl ♡",
  letter: `Jujur, aku nggak tahu harus mulai dari mana, tapi ada satu hal yang udah lama pengen aku sampaikan ke kamu.

Aku seneng bisa kenal kamu. Seneng sama cara kamu cerita, cara kamu senyum, cara kamu jadi diri kamu sendiri, dan hal-hal kecil tentang kamu yang mungkin kamu sendiri nggak sadar kalau itu bikin aku bahagia.

Aku nggak mau cuma jadi seseorang yang datang sebentar lalu pergi. Aku pengen kenal kamu lebih jauh, nemenin hari-hari kamu, dengerin cerita kamu, bikin kamu senyum, dan sama-sama menciptakan banyak kenangan indah.

Aku tahu hubungan bukan cuma tentang kata-kata manis. Aku pengen membuktikan semuanya lewat sikap, waktu, perhatian, dan usaha.

So, there's one little question that I really want to ask you...`,
  bouquetText: "my favorite flower ♡",
  promise: "I promise to make you feel loved, appreciated, and never alone. I want to create beautiful memories with you, one day at a time.",
  yes: ["WAIT... YOU SAID YES?!", "YOU JUST MADE MY WORLD A LITTLE MORE BEAUTIFUL.", "Officially my favorite girl ♡", "I can't wait to create beautiful memories with you."],
  no: ["Thank you for being honest with me ♡", "Whatever your answer is, I'm still grateful that I got to know you.", "Your happiness matters to me, and I respect your feelings."],
  theme: { pink: "#f7b6cb", rose: "#e8728f", blush: "#ffe3ec", lavender: "#d9ccf5" }
};
/* ============================================================ */
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const root=document.documentElement.style;
Object.entries({pink:'--pink',rose:'--rose',blush:'--blush',lavender:'--lav'}).forEach(([k,v])=>root.setProperty(v,CONFIG.theme[k]));
document.title="For "+CONFIG.herName+" ♡";

/* --- typing --- */
let typeId=0;
async function type(el,text,speed=38){const id=++typeId;el.textContent='';const blur=text.length<90;let n=0;const f=document.createDocumentFragment();
  text.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){f.append(w);return}
    const s=document.createElement('span');s.className='w';
    for(const c of w){const k=document.createElement('span');k.className='ch'+(blur?' bl':'');k.textContent=c;k.style.animationDelay=(n++*speed*.8)+'ms';s.append(k)}f.append(s)});
  const wrap=document.createElement('span');wrap.append(f);el.append(wrap);await sleep(RM?0:n*speed*.8+500)}
function hearts(n=10,from){for(let i=0;i<n;i++){const h=document.createElement('span');h.className='heart';h.textContent='♥';
  const r=from?from.getBoundingClientRect():{left:innerWidth/2,top:innerHeight*.7,width:0,height:0};
  h.style.left=r.left+r.width/2+(Math.random()*80-40)+'px';h.style.top=r.top+r.height/2+'px';h.style.fontSize=14+Math.random()*22+'px';
  h.style.setProperty('--x',Math.random()*160-80+'px');h.style.animationDelay=Math.random()*.4+'s';document.body.append(h);setTimeout(()=>h.remove(),2400)}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3200)}
let cur=null;
function show(id,tone){const n=$('#'+id);if(cur){const o=cur;o.classList.add('out');o.classList.remove('on');setTimeout(()=>o.classList.remove('out'),1000)}
  n.classList.add('on');cur=n;document.body.className=tone||'';}

/* --- background canvas: stars, hearts, petals, confetti --- */
const DPR=Math.min(window.devicePixelRatio||1,1.5);
const hs=document.createElement('canvas');hs.width=hs.height=64;{const g=hs.getContext('2d');g.fillStyle='#e8728f';g.beginPath();g.moveTo(32,58);g.bezierCurveTo(2,36,8,6,32,22);g.bezierCurveTo(56,6,62,36,32,58);g.fill()}
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR}rs();addEventListener('resize',rs);
const mk=(t)=>({t,x:Math.random()*W,y:t==='conf'?H*.4:Math.random()*H,s:(t==='star'?1.5+Math.random()*2:10+Math.random()*16)*DPR,v:(.15+Math.random()*.5)*DPR,r:Math.random()*6,p:Math.random()*6,vx:0})
for(let i=0;i<14;i++)P.push(mk('star'));for(let i=0;i<8;i++)P.push(mk('heart'));for(let i=0;i<7;i++)P.push(mk('petal'));
function burst(n=140){const cols=['#f7b6cb','#e8728f','#d9ccf5','#ffe3a8','#fff'];for(let i=0;i<n;i++){const c=mk('conf');c.x=W/2;c.y=H*.45;const a=Math.random()*6.28,s=(4+Math.random()*12)*DPR;c.vx=Math.cos(a)*s;c.v=Math.sin(a)*s-6*DPR;c.c=cols[i%5];c.s=(4+Math.random()*6)*DPR;c.life=140;P.push(c)}}
function draw(tm){cx.clearRect(0,0,W,H);
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    if(p.t==='star'){cx.globalAlpha=.4+.6*Math.abs(Math.sin(tm/900+p.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.3);cx.fill()}
    else if(p.t==='heart'){p.y-=p.v;p.x+=Math.sin(tm/1500+p.p)*.4;if(p.y<-40)p.y=H+40;cx.globalAlpha=.35;cx.drawImage(hs,p.x,p.y,p.s,p.s)}
    else if(p.t==='petal'){p.y+=p.v*1.2;p.x+=Math.sin(tm/1200+p.p)*.8;p.r+=.01;if(p.y>H+30){p.y=-30}cx.globalAlpha=.55;cx.fillStyle='#f7a6bf';cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.beginPath();cx.ellipse(0,0,p.s*.45,p.s*.22,0,0,6.3);cx.fill();cx.restore()}
    else{p.x+=p.vx;p.y+=p.v;p.v+=.18*DPR;p.vx*=.99;p.life--;cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6);if(p.life<=0)P.splice(i,1)}}
  cx.globalAlpha=1;requestAnimationFrame(draw)}
if(!RM)requestAnimationFrame(draw);

/* --- music --- */
const au=new Audio(CONFIG.music.src);au.loop=true;au.volume=.6;let audioOK=true;au.onerror=()=>{audioOK=false};
$('#song').textContent=CONFIG.music.title;$('#artist').textContent=CONFIG.music.artist;
const cov=new Image();cov.onload=()=>{$('#art').textContent='';$('#art').style.backgroundImage='url('+cov.src+')'};cov.src=CONFIG.music.cover;
const fmt=t=>(Math.max(0,t)/60|0)+':'+String(Math.max(0,t)%60|0).padStart(2,'0');
function setPlay(b){$('#isl').classList.toggle('play',b);$('#pp').textContent=b?'❚❚':'▶'}
async function play(){if(!audioOK){toast('Tambahkan file musik di '+CONFIG.music.src);return}try{await au.play();setPlay(true)}catch(e){setPlay(false)}}
$('#pp').onclick=()=>au.paused?play():(au.pause(),setPlay(false));
$('#vol').oninput=e=>au.volume=e.target.value;
au.ontimeupdate=()=>{if(au.duration){$('#seek').value=au.currentTime/au.duration*100;$('#t1').textContent=fmt(au.currentTime);$('#t2').textContent='-'+fmt(au.duration-au.currentTime)}};
$('#seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
$('#bk').onclick=()=>au.currentTime=Math.max(0,au.currentTime-10);$('#fw').onclick=()=>au.currentTime=Math.min(au.duration||0,au.currentTime+10);
const tg=()=>$('#isl').classList.toggle('x');$('#hd').onclick=tg;$('#hd').onkeydown=e=>e.key==='Enter'&&tg();

/* --- intro --- */
async function intro(){show('intro');await sleep(500);await type($('#i1'),CONFIG.intro.line1,70);await sleep(400);await type($('#i2'),CONFIG.intro.line2,45);
  const b=$('#openWorld');b.textContent=CONFIG.intro.button;b.classList.remove('hide')}
$('#openWorld').onclick=async e=>{hearts(18,e.currentTarget);$('#isl').classList.add('on');play();setTimeout(()=>$('#isl').classList.add('x'),700);setTimeout(()=>$('#isl').classList.remove('x'),5200);await sleep(700);story()};

/* --- story --- */
let si=0;
function story(){si=0;$('#dots').innerHTML=CONFIG.story.map(()=>'<i></i>').join('');show('story','s1');scene()}
async function scene(){$('#cont').classList.add('hide');[...$('#dots').children].forEach((d,i)=>d.classList.toggle('a',i===si));
  document.body.className='s'+(1+si%4);hearts(4);await type($('#st'),CONFIG.story[si],42);$('#cont').textContent=si===CONFIG.story.length-1?'Continue ♡':'Continue';$('#cont').classList.remove('hide')}
$('#cont').onclick=()=>{if(++si<CONFIG.story.length)scene();else bookIntro()};

/* --- book --- */
const layouts=['polaroid','tape','flower','card','scrap','polaroid','tape','card'],doodles=['✦','♡','✿','✧','♡','✿','✦','♡'];
let pages=[],pi=0,photoEls=[];
function buildBook(){const b=$('#book');b.innerHTML='';pages=[];photoEls=[];
  const cover=el('div','pg cover');cover.innerHTML=`<div class="rib"></div><svg width="46" height="46" style="position:absolute;top:22px;left:22px"><use href="#fl"/></svg><svg width="38" height="38" style="position:absolute;bottom:24px;right:24px"><use href="#fl"/></svg><div class="emb">♥</div><h2>${CONFIG.bookTitle}</h2><p>${CONFIG.bookSub}</p><button class="btn" id="obook" style="margin-top:12px;padding:12px 22px;font-size:14px">Open the book ♡</button>`;pages.push(cover);
  CONFIG.photos.forEach((ph,i)=>{const p=el('div','pg '+layouts[i%layouts.length]);
    p.innerHTML=`<span class="dd" style="top:18px;left:20px">${doodles[i]}</span><span class="dd" style="bottom:36px;right:22px">${doodles[(i+3)%8]}</span><div class="ph" tabindex="0" role="button" aria-label="Buka foto ${i+1}"><div class="im">♥</div></div><p class="cap">${ph.caption}</p><span class="pn">${i+1}</span>`;
    const im=new Image();im.alt=ph.caption;im.onload=()=>{p.querySelector('.im').replaceChildren(im);p.querySelector('.ph').dataset.ok=1};im.src=ph.src;
    const open=()=>{if(p.querySelector('.ph').dataset.ok)lb(i)};p.querySelector('.ph').onclick=open;p.querySelector('.ph').onkeydown=e=>e.key==='Enter'&&open();
    pages.push(p);photoEls.push(p)});
  const end=el('div','pg');end.innerHTML=`<h2 style="font-size:30px">...and so much more.</h2><p class="cap" style="font-size:26px;margin:14px 0 20px">There's one more thing.</p><button class="btn" id="toLetter" style="padding:12px 22px;font-size:14px">Continue to my letter ♡</button><span class="pn">${CONFIG.photos.length+1}</span>`;pages.push(end);
  pages.forEach((p,i)=>{p.style.zIndex=pages.length-i;b.append(p)});
  $('#obook').onclick=e=>{e.stopPropagation();pi=0;flip(1)};$('#toLetter').onclick=closeBook}
function el(t,c){const e=document.createElement(t);e.className=c;return e}
function bookIntro(){buildBook();pi=0;$('#book').classList.remove('open');$('#bnav').classList.add('hide');show('bookS','s2')}
function flip(d){const n=pi+d;if(n<0||n>=pages.length)return;
  if(d>0){pages[pi].classList.add('fl')}else{pages[n].classList.remove('fl')}
  pi=n;$('#book').classList.toggle('open',pi>0);$('#bnav').classList.toggle('hide',pi===0);}
$('#next').onclick=()=>flip(1);$('#prev').onclick=()=>flip(-1);
let tx=0;$('#bookS').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#bookS').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50&&pi>0)flip(dx<0?1:-1)});
addEventListener('keydown',e=>{if(!$('#bookS').classList.contains('on')||pi===0)return;if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)});
async function closeBook(){for(let i=pi;i>0;i--){pages[i-1].classList.remove('fl');await sleep(120)}pi=0;$('#book').classList.remove('open');$('#bnav').classList.add('hide');await sleep(1000);letter()}

/* --- lightbox --- */
let li=0;const okList=()=>photoEls.map((p,i)=>p.querySelector('.ph').dataset.ok?i:-1).filter(i=>i>=0);
function lb(i){li=i;const im=photoEls[i].querySelector('img');$('#lbi').src=im.src;$('#lbi').alt=im.alt;$('#lbi').classList.remove('z');$('#lb').classList.add('on')}
function lbStep(d){const l=okList();if(!l.length)return;lb(l[(l.indexOf(li)+d+l.length)%l.length])}
$('#lp').onclick=()=>lbStep(-1);$('#ln').onclick=()=>lbStep(1);$('#lc').onclick=()=>$('#lb').classList.remove('on');$('#lbi').onclick=e=>e.target.classList.toggle('z');
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});

/* --- letter --- */
function letter(){const env=$('#env'),paper=$('#paper');env.className='';$('#letterS').classList.remove('o');paper.className='';paper.textContent='';$('#toProp').classList.add('hide');$('#envTo').textContent=CONFIG.envelopeText;show('letterS','s3');
  const go=async()=>{env.onclick=env.onkeydown=null;$('#letterS').classList.add('o');env.classList.add('open');hearts(12,env);setTimeout(()=>burst(70),500);await sleep(1200);paper.classList.add('on');await sleep(1500);const sp=RM?0:48,t0=performance.now();let man=false,run=!RM;['touchstart','wheel'].forEach(e=>paper.addEventListener(e,()=>man=true,{passive:true}));
    const tp=type(paper,CONFIG.letter,sp);
    (function follow(){if(!run||man)return;const c=paper.querySelectorAll('.ch');if(c.length){const i=Math.min(c.length-1,Math.floor((performance.now()-t0)/(sp*.8)));const d=c[i].offsetTop-paper.clientHeight*.55;if(d>paper.scrollTop)paper.scrollTop+=(d-paper.scrollTop)*.12+.3}requestAnimationFrame(follow)})();
    await tp;run=false;$('#toProp').classList.remove('hide')};
  env.onclick=go;env.onkeydown=e=>e.key==='Enter'&&go()}
paper.onclick=()=>{};
$('#toProp').onclick=()=>{const im=new Image();im.onload=()=>{$('#pPortrait').replaceChildren(im)};im.src=CONFIG.photos[0].src;$('#promise').textContent=CONFIG.promise;show('prop','s4')};

/* --- answers --- */
$('#yes').onclick=async e=>{hearts(20,e.currentTarget);burst();show('yesS','s4');if(audioOK&&au.duration>CONFIG.music.chorusStart)au.currentTime=CONFIG.music.chorusStart;play();
  const fp=$('#floatPh');fp.innerHTML='';photoEls.slice(0,3).forEach((p,i)=>{const im=p.querySelector('img');if(im){const c=el('img','');c.src=im.src;c.alt='';c.style.cssText=`width:78px;height:98px;object-fit:cover;border:3px solid #fff;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);transform:rotate(${(i-1)*8}deg)`;fp.append(c)}});
  $('#yBtns').classList.add('hide');['#y1','#y2','#y3','#y4'].forEach(s=>$(s).textContent='');
  await sleep(900);for(let i=0;i<4;i++){await type($(['#y1','#y2','#y3','#y4'][i]),CONFIG.yes[i],34);if(i===1)burst(80)}await sleep(2600);bouquet()};
const BQ=[[30,19],[50,14],[70,19],[19,31],[40,28],[61,28],[81,31],[30,41],[50,40],[70,41]];
async function bouquet(){const bq=$('#bq'),box=$('#bflw');bq.className='';box.innerHTML='';$('#bqCap').textContent='';$('#yBtns').classList.add('hide');show('bqS','s4');
  BQ.forEach(([x,y],i)=>{const f=el('div','bf');f.style.cssText=`left:${x}%;top:${y}%;--d:${(.9+i*.3).toFixed(2)}s;--r:${(Math.random()*16-8).toFixed(1)}deg;--sd:${(i*.37).toFixed(2)}s`;
    f.innerHTML='<div class="pt"><svg><use href="#fl"/></svg></div><div class="fh">♥</div>';
    const im=new Image();im.alt='';im.onload=()=>f.querySelector('.fh').replaceChildren(im);im.src=CONFIG.photos[i%CONFIG.photos.length].src;box.append(f)});
  await sleep(300);bq.classList.add('go');await sleep(1000+BQ.length*300+900);burst(90);hearts(14,bq);await type($('#bqCap'),CONFIG.bouquetText,60);$('#yBtns').classList.remove('hide')}
$('#save').onclick=()=>{const d=new Date().toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'});hearts(12,$('#save'));toast('Moment saved: '+d)};
$('#replay').onclick=()=>{au.pause();au.currentTime=0;setPlay(false);play();$('#intro').querySelector('#i1').textContent='';$('#i2').textContent='';$('#openWorld').classList.add('hide');intro()};
$('#no').onclick=()=>{show('noS','s1');['#n1','#n2','#n3'].forEach((s,i)=>$(s).textContent=CONFIG.no[i]);hearts(8)};
$('#back').onclick=()=>{$('#i1').textContent='';$('#i2').textContent='';$('#openWorld').classList.add('hide');intro()};

/* --- boot --- */
addEventListener('load',async()=>{await sleep(1400);$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),900);intro()});
</script>
</body>
</html>
